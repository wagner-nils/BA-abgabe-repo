# ─────────────────────────────────────────────────────────────────────────────
# CODEBOOK v1.0 — FROZEN 2026-08-30 (the reported instrument)
#
# This one file is the single source of three artifacts:
#   1. the task prompt sent to the model
#   2. the JSON schema that constrains the model's output (Bedrock toolConfig)
#   3. the human annotation sheet
#
# That is what makes the agreement numbers mean anything: the model and the
# human receive identical instructions. Never hand-edit a generated prompt.
#
# v1.0 is FROZEN. Calibration is over: A0 (20 paragraphs) and A0b (12) produced
# 64 coded rows, element prevalence and co-occurrence were computed, and three
# revisions were each forced by that data rather than chosen. A1 onward is
# annotated against THIS version.
#
# Two things to watch while coding A1, both recorded at the freeze:
#   F5a + F6a co-occurred on 7 of 9 F5a rows, mostly from one paragraph. If that
#   repeats, the availability/feasibility boundary needs rewriting, not defending.
#   F2c is new (deployment growth / record / decline, split out of F2b). Watch
#   whether it separates cleanly from F2b investment claims.
#
# Once a version has been used for a reported annotation session, it is frozen.
# Changing it invalidates every annotation made under it, exactly as changing a
# survey item invalidates prior responses.
# ─────────────────────────────────────────────────────────────────────────────

version: "1.0"
status: FROZEN 2026-08-30, after calibration on A0 (20) and A0b (12), 64 coded rows
created: 2026-08-29
frozen: true
frozen_on: 2026-08-30
frozen_after: >
  Two calibration sessions, 64 coded (paragraph x technology) rows. Element
  prevalence and co-occurrence were computed BEFORE freezing, per the review
  finding that broad elements must be checked empirically rather than argued
  about. From here, any change invalidates every annotation made under this
  version.
supersedes: "0.3"

unit_of_analysis: >
  One paragraph of a news article, together with its headline and its article-level
  metadata. Code only what is inside the paragraph. Speakers, comparisons and
  antecedents that live in a neighbouring paragraph are not recoverable at this
  unit and must not be inferred — that limit is stated in the thesis rather than
  worked around.

perspective: >
  The label captures WHAT THE PARAGRAPH ASSERTS about the technology-frame
  relation. It is not what a reader would feel, and it is not whether the outlet
  endorses the claim. Whether an assertion is the outlet's own voice or is
  attributed to a source is recorded separately in the `speaker` field.

# ─── FIELD 1 ── TECHNOLOGY ────────────────────────────────────────────────────
technologies:
  - id: general
    label: Renewable energy in general
    definition: >
      Renewables, clean power, green energy, or "the energy transition" as a
      bundle, with no identifiable individual technology carrying the statement.
  - id: solar
    label: Solar energy
    definition: Solar photovoltaic and solar thermal.
  - id: wind
    label: Wind energy
    definition: Onshore and offshore wind power.
    subtype_field: wind_siting        # onshore | offshore | unspecified
  - id: hydrogen
    label: Hydrogen
    definition: >
      Hydrogen as an energy carrier, particularly low-carbon, renewable or green
      hydrogen. Record the production pathway where the text identifies one.
    subtype_field: hydrogen_pathway   # green | blue | gray | unspecified
  - id: nuclear
    label: Nuclear energy
    definition: >
      Included as a low-carbon COMPARATOR, although not a renewable technology.
  - id: other_renewable
    label: Other renewable technologies
    definition: Hydropower, bioenergy, geothermal, marine energy.
  - id: storage
    label: Energy storage
    definition: >
      Batteries, pumped hydro, and other storage as the SUBJECT of the statement.
    status: PROVISIONAL
    note: >
      Whether storage becomes a seventh category is an open decision for the
      supervisor. It is coded HERE AND NOW anyway, because collapsing `storage`
      into `other_renewable` afterwards is free, while splitting it out
      afterwards requires re-annotating everything. Code it; decide later.

# ─── FIELD 2 ── FRAME ELEMENTS ────────────────────────────────────────────────
# Ten binary items, two per frame. You mark elements; the FRAME is derived from
# them, never coded directly. This is what lets the frame inventory change later
# without re-annotating: P064 reached alpha 0.72 and P068 alpha >= 0.67 on binary
# items, against the 0.35-0.6 ceiling P026 reports for holistic frame labels.

frame_elements:
  - id: F1a
    frame: costs
    label: Cost or price
    fires_when: >
      The paragraph refers to the money cost or price of the technology, of the
      electricity it produces, or of the bills, levies or taxes people pay because
      of it. Includes claims that it is cheap, expensive, cheaper or dearer than
      something else, or that costs are rising or falling.
    does_not_fire_when: >
      A number appears that is not a price. Installed capacity in megawatts,
      output in terawatt-hours, or a count of turbines is NOT a cost claim.

  - id: F1b
    frame: costs
    label: Subsidy, levy or public funding
    fires_when: >
      The paragraph refers to subsidies, feed-in tariffs, levies, auctions, public
      funding, tax credits, or the question of who pays for deployment.

  - id: F2a
    frame: jobs
    label: Employment
    fires_when: >
      The paragraph refers to jobs created, lost, threatened or secured, or to
      workers, skills shortages, or plant closures in employment terms.

  - id: F2b
    frame: jobs
    label: Investment, industry or competitiveness
    fires_when: >
      The paragraph refers to investment, industrial capacity, factory or project
      decisions, exports, supply chains, or national competitiveness.
    does_not_fire_when: >
      A company is merely named, or corporate boilerplate appears, without the
      statement bearing on the technology.
    split_in_v1_0: >
      Deployment growth and record figures moved OUT of this element into F2c.
      In calibration F2b fired on 38% of all rows - the single most common
      element - and inspection of the notes showed roughly a third of those hits
      were pure growth statistics admitted by rule X10 rather than investment
      claims. One element covering both "a company built a factory" and "solar
      hit a record share" is too broad to be coded reliably or interpreted
      afterwards.

  - id: F2c
    frame: jobs
    label: Deployment growth, records and market share
    added_in: "1.0"
    fires_when: >
      The paragraph reports a deployment, output or market figure AS GROWTH, AS A
      RECORD, or AS A DECLINE. "Solar reached a record 22 percent of the mix",
      "installations fell by a fifth", "the IEA expects strong growth".
    does_not_fire_when: >
      The number carries no direction. "Wind produced 132 TWh" on its own fires
      nothing; "wind produced a record 132 TWh, up a fifth" fires F2c.
    note: >
      Supersedes rule X10, which routed these cases into F2b. The litmus test is
      unchanged - a staunch supporter is gratified to read that renewables hit a
      record - so a framing function IS performed and the case must not fall into
      no_frame_present. What changed is only which element receives it.

  - id: F3a
    frame: climate
    label: Emissions or climate effect
    fires_when: >
      The paragraph refers to greenhouse gases, carbon, emissions, climate targets,
      or the technology's effect on the climate.

  - id: F3b
    frame: climate
    label: Transition or phase-out pathway
    fires_when: >
      The paragraph places the technology inside — or as an obstacle to — the
      energy transition, a coal or nuclear phase-out, or a decarbonisation pathway,
      WITHOUT making an explicit emissions claim.

  - id: F4a
    frame: security
    label: Import dependence or independence
    fires_when: >
      The paragraph refers to dependence on, or independence from, energy imports,
      a foreign supplier, or a named exporting country.

  - id: F4b
    frame: security
    label: Security of supply or geopolitics
    fires_when: >
      The paragraph refers to security of supply, sovereignty, geopolitical risk,
      or shortage framed as a national-security matter.
    recall_warning: >
      A frame does NOT require a stated causal mechanism. "Wind strengthens
      Germany's energy security", with no explanation of how, FIRES F4b. P034
      finds that generic, unspecified benefit is the single largest code in energy
      opinion writing; requiring a mechanism would destroy recall on this frame.
      Expect this to be the hardest element for humans too — P031 had to drop its
      entire political frame for failing intercoder reliability.

  - id: F5a
    frame: reliability
    label: Intermittency and dispatchability
    fires_when: >
      The paragraph refers to intermittency, baseload, dispatchability, backup, the
      need for storage, or whether power is available when it is needed.
    does_not_fire_when: >
      Weather is described without being connected to power supply. "It was a
      still, grey week" alone does not fire F5a.

  - id: F5b
    frame: reliability
    label: Grid and system integration
    fires_when: >
      The paragraph refers to grid infrastructure, connection queues, transmission
      lines and their permitting, curtailment, or the siting of generation relative
      to demand.

  # ══════════════════════════════════════════════════════════════════════════
  # ADDED IN v0.2, FROM SESSION A0. 9 of 20 calibration paragraphs (45%) carried
  # a note reporting that no element fitted. The gaps were not random: they
  # clustered into technical feasibility, land and siting, and legal process.
  #
  # ROOT CAUSE, and it is worth a paragraph in Chapter 4: the wiki's frame table
  # collapses Toetzke et al.'s THREE labels - Technology efficiency, Technology
  # characteristics, Infrastructure - into the single frame "Reliability and
  # system integration". F5a/F5b therefore cover the grid and the dispatch
  # problem but not "can this thing be built at all". The collapse created the
  # hole; the pilot found it.
  #
  # ⚠ PROVISIONAL - PENDING SUPERVISOR. This takes the scheme past the five
  # frames in the topic description. The topic description says the scheme "may
  # be refined and distinctions added based on the literature and the retrieval
  # pilot", which is what this is, but it is a research decision and Kerstin
  # should see it before A2 is drawn.
  # ══════════════════════════════════════════════════════════════════════════

  - id: F6a
    frame: feasibility
    label: Technical feasibility and maturity
    fires_when: >
      The paragraph refers to whether the technology can be built, rebuilt,
      restarted or operated at all: technical obstacles, immaturity,
      irreversibility, or a physical constraint on doing it.
    boundary: >
      NOT F5a. F5a is about delivering power when it is needed - intermittency,
      baseload, backup. F6a is about whether the plant can exist or run at all.
      "Reaktivierung kaum mehr denkbar, weil der Rückbau fortgeschritten ist"
      is F6a, not F5a.
    a0_evidence: A002_p02, A002_p03, A002_p05, A002_p07, A019_p10

  - id: F6b
    frame: feasibility
    label: Technical performance and potential
    fires_when: >
      The paragraph refers to efficiency, yield, output potential, or the
      technical suitability of a design or a site.
    boundary: >
      NOT F1a. Cost per unit is F1a; energy per unit of area, or a yield
      estimate, is F6b. "Cheaper per MWh" is F1a. "Produces more kWh per m²" is
      F6b. A paragraph can fire both.
    boundary_vs_F5a: >
      ADDED IN v0.3, from A0b. The annotator wrote on A011_p02 ("weak wind
      conditions cut the wind turbines' output by 3.2 percent"): "F5a and/or F6b
      depending whether interpreted as availability vs yield." The rule is the
      CAUSE, not the effect:
        - the cause is weather, season or variability  -> F5a (it is an
          availability claim: the wind did not blow)
        - the cause is the design, the site or the technology's efficiency
          -> F6b (it is a performance claim: this design yields this much)
      A011_p02 is therefore F5a. "PV on noise barriers yields X kWh/m²" is F6b.
      Both fire when the text makes both claims.
    a0_evidence: A019_p08, A019_p09, A011_p02

  - id: F7a
    frame: siting
    label: Land and area requirement
    fires_when: >
      The paragraph refers to how much land or space the technology needs, or to
      competition with other uses of that land.
    a0_evidence: A019_p05 ("fast vier Prozent der Bodenflächen")

  - id: F7b
    frame: siting
    label: Landscape, visual impact and local amenity
    fires_when: >
      The paragraph refers to how the technology looks in the landscape, to
      noise, to local acceptance or opposition, or to a siting conflict.
    note: >
      P031 found a single contested offshore project driving an entire US
      state's coverage profile, so this element is not decorative - it is where
      local conflict enters the corpus.
    a0_evidence: A019_p01 ("Es glitzert und glänzt entlang der A9")

  - id: F8a
    frame: regulation
    label: Regulation, permitting and legal process
    fires_when: >
      The paragraph refers to approval procedures, legal classification,
      planning law, regulatory burden, or regulatory facilitation.
    boundary: >
      NOT F5b. F5b is permitting of GRID infrastructure - transmission lines,
      connection queues. F8a is the legal and administrative treatment of the
      generating installation itself.
    a0_evidence: >
      A002_p04 (restart legally reclassified as new build - the annotator wrote
      "No obvious F1-F5 element; possible F6"), A003_p01 (Genehmigungsrecht)

  - id: F9
    frame: other
    label: Other frame
    fires_when: >
      A framing function is clearly performed that none of F1a-F8a captures.
    requires_note: true
    supersedes: "F6 in v0.1, renumbered because F6 is now a frame"

no_frame_present:
  label: No frame present
  fires_when: >
    The paragraph mentions a technology but performs NO framing function at all -
    pure procedural or factual reporting. A permit was granted, a plant went
    online, a meeting is scheduled, a vote was 34 to 11.
  # ── CHANGED IN v0.2. THE MOST IMPORTANT RULE CHANGE FROM A0. ──────────────
  hard_rule: >
    `no_frame_present` means THE TEXT DOES NOT FRAME. It does NOT mean "I could
    not find an element that fits". If you believe something is being framed but
    no element matches, that is **F9 plus a note** - never `no_frame_present`.
  why: >
    In session A0, A002_p03 and A019_p12 were both marked no_frame_present with
    notes reading "unclear whether feasibility should count as framing" and
    "delay is mentioned but no clear frame claim". Both were paragraphs that DO
    frame, using a category the codebook lacked. Left uncorrected, this rule
    would have silently converted every missing category into a fake null, and
    the "no frame present" share - which the thesis reports as a finding - would
    have measured the codebook's gaps rather than the corpus.
  note: >
    A substantive value, not missing data. Its share is reported alongside the
    label distributions. P031 found only 19% of US wind articles mentioned
    climate at all; much energy coverage genuinely fits no frame.

frame_derivation:
  costs:       [F1a, F1b]        # frame fires if ANY of its elements fires
  jobs:        [F2a, F2b, F2c]
  climate:     [F3a, F3b]
  security:    [F4a, F4b]
  reliability: [F5a, F5b]
  feasibility: [F6a, F6b]        # NEW in v0.2
  siting:      [F7a, F7b]        # NEW in v0.2
  regulation:  [F8a]             # NEW in v0.2
  other:       [F9]

# ─── FIELD 3 ── EVALUATION ────────────────────────────────────────────────────
# Coded PER FIRED FRAME, not once per paragraph. P031 found aggregate benefit
# framing near-identical across three US states while risk framing differed
# sharply — a single net valence would have hidden the entire finding.

evaluation:
  litmus_test: >
    Would a staunch SUPPORTER of this technology be gratified to see this printed?
    Would a staunch OPPONENT be? (Boydstun et al., Policy Frames Codebook.)
  values:
    - id: positive
      definition: A staunch supporter would be gratified; an opponent would not.
    - id: negative
      definition: A staunch opponent would be gratified; a supporter would not.
    - id: neutral
      definition: >
        A factual mention within the frame that would gratify neither side.
        News prose is overwhelmingly factual in register, so this class will be
        large, and how you define it will drive the numbers.
    - id: mixed
      definition: >
        Both a positive and a negative evaluation are present on the SAME frame.
        Inherited directly from SemEval ABSA's `conflict`, whose organizers
        explicitly refused to force a dominant polarity because that "would be
        difficult to agree on".
  excluded_value:
    id: uncertain
    reason: >
      `uncertain` is deliberately NOT in this list. It is a statement about the
      annotator, not about the text. Mixing an epistemic label into a semantic
      label set makes the distribution uninterpretable and inflates apparent
      disagreement. Annotator uncertainty goes in `confidence`.
  calibration_rule: >
    When torn between `neutral` and a valenced label, choose `neutral`. When torn
    between `mixed` and a single valence, choose `mixed` only if you can point to
    both directions in the text.

# ─── FIELD 4 ── COMPARISON TARGET ─────────────────────────────────────────────
comparison_target:
  definition: >
    Where an evaluation is made by comparison against a reference point, record
    that reference point. Scored independently of the frame and evaluation
    labels, and reported with its own agreement figure.
  values: [natural_gas, coal, oil, fossil_generic, grid_status_quo,
           general, solar, wind, hydrogen, nuclear, other_renewable, storage,
           multiple, none, other]
  # ── CHANGED IN v1.0, AND THIS RESOLVES AN OPEN DECISION ──────────────────
  resolved_open_decision: >
    v0.1-v0.3 excluded the study technologies from this list, on the 2026-08-04
    reasoning that admitting `nuclear` would double-count it. Calibration refutes
    that reasoning empirically. Ten of 64 rows used `other`, and SEVEN of those
    ten were technology-against-technology comparisons the value list had no way
    to express: A019_p09 solar<->wind, A024_p02 solar<->wind, A004_p04
    solar/wind against "nuclear and coal". Technology-against-technology is not
    an edge case in this corpus; it is the DOMINANT comparison mode.
    THE DOUBLE-COUNTING WORRY WAS A CATEGORY ERROR. A technology row answers
    "what does the text say about X". A comparison target answers "against what".
    They are different fields answering different questions, and a technology may
    legitimately appear in both - in different rows.
    CONSEQUENCE: the open tie-break rule is not decided, it is DISSOLVED. There
    is no longer a case where the annotator must choose between giving the
    reference point its own row and putting it in the comparison field. Both
    happen, independently, by their own criteria. `tiebreak_used` is retired.
  rules:
    - "`none` is a substantive value and NOT missing data."
    - "`other` requires a note, and should now be rare."
    - >
      `multiple` where the text compares against more than one reference point
      (A004_p04: "nuclear and coal"). List them in `comparison_note`. Single
      values stay single so that the agreement figure remains computable.
    - >
      A technology named ONLY as a reference point does not get its own
      technology row unless the text also evaluates it in its own right. That is
      the old tie-break, now demoted to an ordinary coding rule because nothing
      hangs on it.
  retired_in_v1_0:
    field: tiebreak_used
    reason: >
      Kept in the sheet as a dead column for one more session so that the
      calibration files stay parseable; ignored in analysis.

# ─── FIELD 5 ── SPEAKER ───────────────────────────────────────────────────────
speaker:
  status: DESCRIPTIVE ONLY — carried in the schema, reported as a distribution,
          explicitly not a measured contribution of this thesis.
  values:
    - id: outlet
      definition: The article's own narrating voice.
    - id: political
      definition: Government, party, parliament, regulator, or a named politician.
    - id: industry
      definition: A company, industry association, or a named executive.
    - id: ngo
      definition: An NGO, campaign group, or citizens' initiative.
    - id: expert
      definition: A researcher, academic institution, or independent analyst.
    - id: unattributed
      definition: An evaluation with no identifiable source in this paragraph.
    - id: ambiguous
      definition: >
        The paragraph blends the outlet's voice with an attributed one so that
        they cannot be separated. Use this rather than guessing.
  caution: >
    Direct quotation is only about 21 % of quotes in German news (P079); most
    attributable evaluation is indirect. Journalists also select, relocate and
    reword quotations, erasing the question that elicited them (P080), so an
    attributed evaluation measures MEDIATED attributed stance, not speaker stance.

# ─── FIELD 6 ── CONFIDENCE ────────────────────────────────────────────────────
confidence:
  values:
    - {id: 1, label: "guessing — the text genuinely underdetermines the label"}
    - {id: 2, label: "reasonably sure"}
    - {id: 3, label: "clear"}
  note: >
    Kept strictly separate from the label. A `confidence: 1` row is data about the
    instrument, not a failure. If a paragraph takes more than three minutes, mark
    1, write a note, and move on.

# ─── WHAT CALIBRATION MEASURED ────────────────────────────────────────────────
# 64 coded rows, A0 + A0b. Recorded here because the numbers are the reason the
# instrument looks the way it does, and Chapter 4 is written from them.
calibration_evidence:
  rows_coded: 64
  element_prevalence_top: {F2b: "38%", F6a: "22%", F5a: "14%", F7a: "14%"}
  never_fired:
    F9: >
      ZERO uses of the residual "other frame" across 64 rows. In v0.1, 45% of
      calibration paragraphs reported that no element fitted. After the v0.2
      extension added feasibility, siting and regulation, nothing needed the
      residual at all. This is the strongest available evidence that the frame
      inventory is now complete FOR THIS CORPUS, and it is a reportable result
      rather than an absence.
    F2a: >
      ZERO employment mentions in 64 rows. A corpus fact, not a codebook defect -
      these 14 articles simply do not cover jobs. CONSEQUENCE: F2a's reliability
      cannot be measured on the pilot, and that belongs in the limitations.
  evaluation_coverage: >
    Every fired frame received an evaluation; no orphan frames and no evaluations
    without a fired element. 100% across all eight frames.
  watch_on_A1:
    F5a_F6a: >
      Seven of the nine F5a rows also fired F6a. Most come from one paragraph
      (A018_p08, an integrated wind-hydrogen-battery plant) so this may be a
      single-article artifact rather than a boundary failure. If the pattern
      repeats on A1, the availability/feasibility boundary needs rewriting.
    F5a_F5b: >
      Fired together on all three F5b rows. Small n; watch whether the two
      reliability elements are separable at all.
  confidence_distribution: >
    50x "clear", 14x "fairly sure", ZERO "guessing". Encouraging after two
    revisions, but worth watching: an annotator who never uses the bottom of the
    scale hides instrument uncertainty rather than removing it.

# ─── WHAT DOES NOT COUNT ──────────────────────────────────────────────────────
# The load-bearing half of an interpretive codebook. Read this before every
# session, not once.
exclusion_principles:
  - id: X1
    rule: >
      Merely naming a technology is not a frame. "The wind farm went into
      operation on Tuesday" fires no element.
  - id: X2
    rule: >
      A frame does not require a stated mechanism. An asserted benefit with no
      explanation still fires its element. (See F4b's recall warning.)
  - id: X3
    rule: >
      Repeating an evaluation that a quoted source voiced is not the outlet's own
      evaluation. Code the evaluation, and set `speaker` to mark it as attributed.
      Do not average the two into one row.
  - id: X4
    rule: >
      Do not infer from the headline, the previous paragraph, or the rest of the
      article. The paragraph is the unit. If the referent is only resolvable
      outside the paragraph, set `confidence: 1` and say so in the note.
  - id: X5
    rule: >
      Do not code your own knowledge of the world. If the paragraph makes a claim
      you believe is false, code the claim it makes.
  - id: X6
    rule: >
      A number is not automatically an economic frame. Capacity, output and
      turbine counts are not F1a; prices, costs and bills are.
  - id: X10
    rule: >
      ADDED IN v0.3, from A0b, and it resolves a direct inconsistency. A010_p15
      ("solar and wind reached a record 22 percent of the EU mix, a one-fifth
      increase") was marked no_frame_present with the note "no clear frame
      beyond factual performance statistics". A024_p02 ("record solar generation
      and strong expected growth") was not, with the note "could signal market
      growth". The two paragraphs are doing the same thing and must be coded the
      same way.
      SUPERSEDED IN v1.0: these cases now fire **F2c**, not F2b. The reasoning
      below stands; only the receiving element changed.
      RULE: a deployment, output or market statistic reported as GROWTH, as a
      RECORD, or as a DECLINE fires **F2c**. Apply the litmus test - a staunch
      supporter is gratified to read that renewables hit a record share, so a
      framing function is being performed. Where the text also ties the number
      to the transition or to a phase-out, **F3b** fires as well.
      A bare number with no directional framing ("wind produced 132 TWh") fires
      nothing on its own.
      WHY THIS MATTERS BEYOND CONSISTENCY: growth statistics are extremely
      common in this corpus. Letting them fall into no_frame_present would make
      the reported "no frame present" share measure the codebook's blind spot
      rather than the corpus, which is the same defect the v0.2 nfp rule fixed.
  - id: X11
    rule: >
      ADDED IN v0.3, from A0b. On A007_p03 the note reads "EEG also implicitly
      includes other technologies I believe". It does - but that is world
      knowledge, not text. Tick only the technologies the paragraph itself makes
      a statement about. This is X5 applied to the technology field rather than
      to the evaluation.
  - id: X8
    rule: >
      The technology columns take 0 or 1 and nothing else. In A0 the label
      "nuclear" was typed into `tech_general` while the correct box was also
      ticked; harmless there, silently wrong if it happens on a column that is
      not cross-checked.
  - id: X9
    rule: >
      Recorded from A0 as a MEASURED COST of X4, not as a rule change. A002_p08
      quotes a minister calling the reactor plans "realitätsfern" - clearly an
      evaluation of nuclear power - but the word "nuclear" appears nowhere in
      the paragraph. Coded with no technology, correctly. That is 1 of 20 = 5%
      of evaluative paragraphs lost to the paragraph unit, and the figure
      belongs in the limitations chapter rather than in a workaround.
  - id: X7
    rule: >
      Do not code the technology's evaluation from the article's overall tone.
      This is the single most likely error mode: models attribute a passage's
      overall sentiment to the wrong target when several are present, losing 25-69
      accuracy points (P040), and multi-technology paragraphs are 41 % of this
      corpus. Each technology gets its own judgement.

# ─── PROMPT GENERATION ────────────────────────────────────────────────────────
prompt:
  system: >
    Rendered from this file. Contains: unit of analysis, perspective, every
    definition above, every exclusion principle, the worked examples, and the
    abstention instruction. Never written by hand.
  abstention_instruction: >
    If no technology-frame relation is present, return an empty relation list and
